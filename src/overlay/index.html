<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KawKaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="overlay">
    <canvas id="kawkaw-canvas"></canvas>

    <!-- Confused terminal: CSS speech bubble, positioned by game.js -->
    <div id="confused-bubble" class="hidden">?</div>

    <!-- Meter HUD: Flee ◀ ────●──── ▶ Lick. Marker position = meter. -->
    <div id="meter" class="hidden">
      <span class="meter-end shoo">SHOO</span>
      <div id="meter-track"><div id="meter-marker"></div></div>
      <span class="meter-end call">CALL</span>
    </div>

    <!-- Shown when chat can't be reached (OBS) or the bot is unreachable -->
    <div id="connection-lost" class="hidden">Connection lost — please refresh</div>
  </div>

  <script src="js/sprites.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/meter.js?v=4"></script>
  <script src="js/chat.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
